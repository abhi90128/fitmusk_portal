{% extends "base.html" %}

{% block content %}

<h2>Maintenance Calorie Calculator</h2>

<form method="POST">

    <label>Weight (kg):</label><br>
    <input type="number" step="0.1" name="weight" required><br><br>

    <label>Height (cm):</label><br>
    <input type="number" step="0.1" name="height" required><br><br>

    <label>Age:</label><br>
    <input type="number" name="age" required><br><br>

    <label>Gender:</label><br>
    <select name="gender" required>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select><br><br>

    <button type="submit">Calculate Calories</button>

</form>

{% if calories %}
    <h3>Maintenance: {{ calories }} kcal/day</h3>
    <p>Fat Loss: {{ calories - 500 }} kcal/day</p>
    <p>Muscle Gain: {{ calories + 300 }} kcal/day</p>
{% endif %}

{% endblock %}
